<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="name"></h1>
      <label for="bundle" data-i18n="bundleLabel"></label>
      <textarea id="bundle" rows="8" spellcheck="false" maxlength="2097152"></textarea>
      <p class="hint" data-i18n="bundleHint"></p>
      <div class="row">
        <button id="apply" type="button" data-i18n="apply"></button>
        <button id="detach" type="button" data-i18n="detach"></button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
