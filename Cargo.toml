[workspace]
resolver = "2"
members = ["crates/veneer", "crates/veneer-wasm", "crates/veneer-cli", "crates/veneer-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LLCForge/Veneer"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand_chacha = "0.9"
